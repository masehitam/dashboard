# Aplikasi Dashboard: landing page (nginx) + Metabase + PostgreSQL (penyimpanan Metabase + data contoh).
name: dashboard

services:
  pilot-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Isi .env}
      PEMBACA_PASSWORD: ${PEMBACA_PASSWORD:?Isi .env}
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - pilot-db:/var/lib/postgresql/data
      - ./db/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - ./data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d data_uji"]
      interval: 5s
      retries: 20

  metabase:
    image: metabase/metabase:v0.64.4.5
    restart: unless-stopped
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: pilot-db
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase
      MB_DB_USER: postgres
      MB_DB_PASS: ${POSTGRES_PASSWORD}
      MB_SITE_LOCALE: id
      MB_SITE_URL: ${MB_SITE_URL:-http://localhost:3100/app}
      JAVA_OPTS: ${JAVA_OPTS:--Xmx1g}
      MB_LLM_ALLOWED_NETWORKS: allow-private
    depends_on:
      pilot-db: {condition: service_healthy}

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3100}:80"]
    volumes:
      - ./landing:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [metabase]

volumes:
  pilot-db:
    name: ${DB_VOLUME:-dashboard_db}
